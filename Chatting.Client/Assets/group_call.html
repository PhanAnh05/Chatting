<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;background:#0f172a;color:#fff;font-family:Segoe UI,Arial,sans-serif;height:100vh;overflow:hidden}
#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;padding:14px;height:100vh;align-content:center}
.tile{position:relative;min-height:180px;background:#1e293b;border-radius:14px;overflow:hidden;display:flex;align-items:center;justify-content:center}.tile video{width:100%;height:100%;object-fit:cover;background:#111827}.name{position:absolute;left:10px;bottom:10px;background:#020617a8;border-radius:7px;padding:5px 9px;font-size:14px}.avatar{width:86px;height:86px;border-radius:50%;background:#2563eb;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:700}.local{border:2px solid #38bdf8}
</style></head>
<body><div id="grid"></div>
<script>
const config={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'stun:stun.cloudflare.com:3478'}]};
const peers=new Map(); const pending=new Map(); const pendingPeers=new Map(); const pendingSignals=[]; let stream=null; let selfId=''; let isVideo=false; let mediaInitialized=false;
const host=message=>window.chrome?.webview?.postMessage(message);
const idText=id=>String(id||'').toLowerCase();
function tile(id,name,isLocal){let el=document.getElementById('peer-'+id);if(el)return el;el=document.createElement('div');el.id='peer-'+id;el.className='tile'+(isLocal?' local':'');const video=document.createElement('video');video.autoplay=true;video.playsInline=true;video.muted=!!isLocal;video.style.display='none';const avatar=document.createElement('div');avatar.className='avatar';avatar.textContent=(name||'?').trim().charAt(0).toUpperCase();const label=document.createElement('div');label.className='name';label.textContent=(name||'Người dùng')+(isLocal?' (Bạn)':'');el.append(video,avatar,label);document.getElementById('grid').append(el);return el}
function showStream(id,media){const el=document.getElementById('peer-'+id);if(!el)return;const video=el.querySelector('video'),avatar=el.querySelector('.avatar');const hasVideo=isVideo&&media.getVideoTracks().some(track=>track.readyState==='live');video.srcObject=media;video.style.display=hasVideo?'block':'none';avatar.style.display=hasVideo?'none':'flex';if(hasVideo)video.play().catch(e=>host({type:'error',payload:e.message}));}
function emitSignal(targetUserId,signalType,data){host({type:'signal',payload:{targetUserId,signalType,data:data||''}})}
function makePeer(remoteId,name){remoteId=idText(remoteId);if(peers.has(remoteId))return peers.get(remoteId);tile(remoteId,name,false);const pc=new RTCPeerConnection(config);const item={pc,name,remote:new MediaStream()};peers.set(remoteId,item);stream?.getTracks().forEach(track=>pc.addTrack(track,stream));pc.onicecandidate=e=>{if(e.candidate)emitSignal(remoteId,'ice-candidate',JSON.stringify(e.candidate))};pc.ontrack=e=>{if(e.streams[0])showStream(remoteId,e.streams[0]);else{item.remote.addTrack(e.track);showStream(remoteId,item.remote)};host({type:'connected'})};pc.onconnectionstatechange=()=>{if(['failed','closed'].includes(pc.connectionState))removePeer(remoteId)};return item}
async function offer(remoteId,name){const item=makePeer(remoteId,name);if(item.offering)return;item.offering=true;try{const o=await item.pc.createOffer({offerToReceiveAudio:true,offerToReceiveVideo:isVideo});await item.pc.setLocalDescription(o);emitSignal(remoteId,'offer',JSON.stringify(o))}catch(e){host({type:'error',payload:e.message})}}
async function handleSignal(senderUserId,signalType,data){const remoteId=idText(senderUserId);const item=makePeer(remoteId,'Thành viên');try{if(signalType==='offer'){await item.pc.setRemoteDescription(JSON.parse(data));const a=await item.pc.createAnswer();await item.pc.setLocalDescription(a);emitSignal(remoteId,'answer',JSON.stringify(a));await flush(remoteId)}else if(signalType==='answer'){await item.pc.setRemoteDescription(JSON.parse(data));await flush(remoteId)}else if(signalType==='ice-candidate'){const c=JSON.parse(data);if(item.pc.remoteDescription)item.pc.addIceCandidate(c);else{const list=pending.get(remoteId)||[];list.push(c);pending.set(remoteId,list)}}}catch(e){host({type:'error',payload:e.message})}}
async function flush(remoteId){const item=peers.get(idText(remoteId));for(const c of pending.get(idText(remoteId))||[])await item.pc.addIceCandidate(c);pending.delete(idText(remoteId))}
function removePeer(id){id=idText(id);const item=peers.get(id);if(item){item.pc.close();peers.delete(id)}pending.delete(id);document.getElementById('peer-'+id)?.remove()}
async function init(message){if(stream)stream.getTracks().forEach(track=>track.stop());stream=null;for(const id of [...peers.keys()])removePeer(id);mediaInitialized=false;selfId=idText(message.self.userId);isVideo=message.callType==='Video';tile(selfId,message.self.displayName||message.self.username,true);try{stream=await navigator.mediaDevices.getUserMedia({audio:true,video:isVideo});showStream(selfId,stream);host({type:'mediaReady'})}catch(e){host({type:'error',payload:e.message})}finally{mediaInitialized=true;for(const [id,name] of pendingPeers){makePeer(id,name);if(selfId<id)await offer(id,name)}pendingPeers.clear();for(const signal of pendingSignals)await handleSignal(signal.senderUserId,signal.signalType,signal.data);pendingSignals.length=0}}
window.chrome?.webview?.addEventListener('message',async e=>{const m=typeof e.data==='string'?JSON.parse(e.data):e.data;if(!m?.action)return;if(m.action==='init')await init(m);else if(m.action==='addPeer'){const remote=idText(m.userId);if(remote===selfId)return;if(!mediaInitialized){pendingPeers.set(remote,m.name);return}makePeer(remote,m.name);if(selfId<remote)await offer(remote,m.name)}else if(m.action==='signal'){if(!mediaInitialized){pendingSignals.push({senderUserId:m.senderUserId,signalType:m.signalType,data:m.data});return}await handleSignal(m.senderUserId,m.signalType,m.data)}else if(m.action==='removePeer'){const id=idText(m.userId);pendingPeers.delete(id);for(let i=pendingSignals.length-1;i>=0;i--)if(idText(pendingSignals[i].senderUserId)===id)pendingSignals.splice(i,1);removePeer(id)}else if(m.action==='toggleMic')stream?.getAudioTracks().forEach(t=>t.enabled=m.enabled);else if(m.action==='toggleCam')stream?.getVideoTracks().forEach(t=>t.enabled=m.enabled);else if(m.action==='end'){stream?.getTracks().forEach(t=>t.stop());stream=null;mediaInitialized=false;pending.clear();pendingPeers.clear();pendingSignals.length=0;for(const id of [...peers.keys()])removePeer(id);document.getElementById('peer-'+selfId)?.remove()}});
host({type:'ready'});
</script></body></html>
